<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRDD</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: grid; place-items: center; }

  #xrdd-ascii {
    margin: 0;
    color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    /* 140 sutun: font boyutu ekran genisligine gore olceklenir */
    font-size: calc(min(94vw, 1100px) / 84.0);
    line-height: 1.2;
    white-space: pre;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    user-select: none;
  }
</style>
</head>
<body>
  <pre id="xrdd-ascii" role="img" aria-label="XRDD"></pre>
  <script src="xrdd-ascii.js"></script>
</body>
</html>
