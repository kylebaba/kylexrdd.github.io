<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRDD</title>
<link id="favicon" rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: grid; place-items: center; }

  #xrdd-ascii {
    margin: 0;
    color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    /* 140 sutun: font boyutu ekran genisligine gore olceklenir */
    font-size: calc(min(94vw, 1100px) / 84.0);
    line-height: 1.2;
    white-space: pre;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    user-select: none;
  }
</style>
</head>
<body>
  <pre id="xrdd-ascii" role="img" aria-label="XRDD"></pre>
  <script src="xrdd-ascii.js"></script>
  <script>
    // Sekme ikonu iki logo arasinda doner: XRD <-> xrd
    (function () {
      var ICONS = ["favicon.png", "favicon-small.png"];
      var MS = 800; // her ikonun ekranda kalma suresi (ms)
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      ICONS.forEach(function (src) { new Image().src = src; }); // onceden yukle
      var i = 0;
      setInterval(function () {
        i = (i + 1) % ICONS.length;
        var link = document.createElement("link");
        link.id = "favicon"; link.rel = "icon"; link.type = "image/png"; link.href = ICONS[i];
        var old = document.getElementById("favicon");
        if (old) old.parentNode.removeChild(old);
        document.head.appendChild(link);
      }, MS);
    })();
  </script>
</body>
</html>
